[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whop-agent-command-center"
version = "0.1.0"
description = "LangGraph content operations command center foundation"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2,<2", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
